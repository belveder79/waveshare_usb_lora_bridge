[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 921600

; Build for a device that already has Archie3d's custom serial bootloader
; (https://github.com/Archie3d/waveshare-usb-lora-bootloader) installed at
; 0x08000000-0x08004000. That bootloader jumps to the app at 0x08004000, so
; this firmware image must be linked to run from that offset instead of
; 0x08000000. Flash it with tools/flash_over_bootloader.py, not `pio run -t
; upload` (there is no stock PlatformIO uploader for this protocol).
[env:bluepill_f103c8_bootloader]
platform = ststm32
board = bluepill_f103c8
framework = arduino
board_build.flash_offset = 0x4000
monitor_speed = 921600
